<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clawd</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="stage">

    <!-- clawd-sprites:start -->
    <!-- hanging from the cursor by one arm (drag + fall) -->
    <div id="hang" class="sprite" hidden>
      <svg viewBox="0 0 150 120" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
        <!-- hard hat (working) -->
        <g class="acc acc-hat"><rect x="44" y="36" width="36" height="7" fill="#FFC53D"/><rect x="44" y="36" width="6" height="7" fill="#E8A912"/><rect x="36" y="43" width="52" height="7" fill="#FFC53D"/><rect x="36" y="43" width="6" height="7" fill="#E8A912"/><rect x="28" y="50" width="68" height="7" fill="#E8A912"/><rect x="58" y="37" width="8" height="3" fill="#C98F12"/><rect x="55" y="40" width="14" height="9" fill="#C98F12"/><rect x="58" y="49" width="8" height="2" fill="#C98F12"/><rect x="58" y="41" width="8" height="7" fill="#FFF1B8"/></g>
        <!-- wristwatch on the free arm (permission) -->
        <g class="acc acc-watch"><rect x="94" y="72" width="16" height="16" fill="#D97757"/><rect x="94" y="78" width="16" height="4" fill="#2F3A48"/><rect x="98" y="76" width="8" height="8" fill="#3F7ACB"/><rect x="99" y="77" width="3" height="3" fill="#9CCBF7"/></g>
        <!-- plain free arm otherwise -->
        <rect class="plain-arm" x="94" y="72" width="16" height="16" fill="#D97757"/>
        <!-- body -->
        <rect x="30" y="56" width="64" height="48" fill="#D97757"/><rect x="30" y="56" width="8" height="48" fill="#BF5F42"/>
        <g class="eyes"><rect x="38" y="64" width="8" height="8" fill="#141414"/><rect x="78" y="64" width="8" height="8" fill="#141414"/></g>
        <!-- hammer raised in the free hand (working) -->
        <g class="acc acc-pick"><rect x="94" y="56" width="16" height="16" fill="#D97757"/><rect x="100" y="38" width="4" height="18" fill="#6B4A2E"/><rect x="90" y="29" width="24" height="9" fill="#9CA3AD"/><rect x="90" y="34" width="24" height="4" fill="#6F7680"/><rect x="92" y="30" width="4" height="3" fill="#C9CFD6"/></g>
        <g class="legs"><rect x="30" y="104" width="8" height="16" fill="#BF5F42"/><rect x="46" y="104" width="8" height="16" fill="#D97757"/><rect x="70" y="104" width="8" height="16" fill="#D97757"/><rect x="86" y="104" width="8" height="16" fill="#D97757"/></g>
        <!-- left arm lifted over his head, gripping at the cursor point (30,40) -->
        <rect x="22" y="40" width="16" height="16" fill="#BF5F42"/>
      </svg>
    </div>

    <!-- upright, walking home -->
    <div id="walk" class="sprite" hidden>
      <svg viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
        <g class="legsA"><rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/></g>
        <g class="legsB"><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/></g>
        <g class="torso">
          <rect class="arm-left" x="4" y="52" width="16" height="16" fill="#BF5F42"/>
          <rect class="arm-right" x="84" y="52" width="16" height="16" fill="#D97757"/>
          <!-- watch arm (permission) -->
          <g class="acc acc-watch2"><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="84" y="58" width="16" height="4" fill="#2F3A48"/><rect x="88" y="56" width="8" height="8" fill="#3F7ACB"/><rect x="89" y="57" width="3" height="3" fill="#9CCBF7"/></g>
          <rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/>
          <g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g>
          <!-- hard hat (working) -->
          <g class="acc acc-hat2"><rect x="34" y="16" width="36" height="7" fill="#FFC53D"/><rect x="34" y="16" width="6" height="7" fill="#E8A912"/><rect x="26" y="23" width="52" height="7" fill="#FFC53D"/><rect x="26" y="23" width="6" height="7" fill="#E8A912"/><rect x="18" y="30" width="68" height="7" fill="#E8A912"/><rect x="48" y="17" width="8" height="3" fill="#C98F12"/><rect x="45" y="20" width="14" height="9" fill="#C98F12"/><rect x="48" y="29" width="8" height="2" fill="#C98F12"/><rect x="48" y="21" width="8" height="7" fill="#FFF1B8"/></g>
          <!-- hammer raised (working) -->
          <g class="acc acc-pick2"><rect x="84" y="36" width="16" height="16" fill="#D97757"/><rect x="90" y="18" width="4" height="18" fill="#6B4A2E"/><rect x="80" y="9" width="24" height="9" fill="#9CA3AD"/><rect x="80" y="14" width="24" height="4" fill="#6F7680"/><rect x="82" y="10" width="4" height="3" fill="#C9CFD6"/></g>
        </g>
      </svg>
    </div>
    <!-- clawd-sprites:end -->
  </div>
  <script src="overlay.js"></script>
</body>
</html>

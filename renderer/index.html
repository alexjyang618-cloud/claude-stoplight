<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clawd</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root">

    <!-- Everything is placed in one square, in the coordinates of a lamp in the
         bottom-right corner of the screen (see geometry.js); app.js mirrors it
         for the other three corners. -->
    <div id="space" class="state-off">

      <!-- the tray, opened on hover: a quarter-disc carrying the usage tile,
           the sessions card and the status pill -->
      <div id="tray" role="group" aria-label="Sessions and plan usage" inert>
        <div id="plate"></div>
        <svg id="tiles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <g id="tiles-g">
            <g id="usage-tile">
              <path id="tile-usage"></path>
              <g id="gauges"></g>
            </g>
            <path id="tile-card"></path>
          </g>
        </svg>
        <!-- what is written on each tile, so it moves as one with its tile -->
        <div id="usage-face">
        <div id="legend"></div>
        <!-- only a terminal session reports usage (see lib/usage.js): a reply in
             the Claude app brings none, so the hint must not promise one. It
             shows when Claude Code's sign-in could not be used or renewed either. -->
        <div id="uhint" hidden title="Sessions in the Claude app don't report plan usage, and Clawd has not been able to ask for it with Claude Code's sign-in. One reply in a terminal session brings the figures.">Usage appears when Claude replies in a terminal</div>
        </div>
        <div id="card-face">
        <div id="rows"></div>
        <div id="more" hidden></div>
        <div id="empty" hidden>Waiting for Claude Code</div>
        </div>
        <div id="pill">
          <span id="pill-label"></span>
          <span id="pill-time"></span>
        </div>
      </div>

      <!-- at rest: how long the oldest waiting session has waited -->
      <div id="wait" hidden></div>

      <!-- a wait that has turned urgent -->
      <div id="pulse" aria-hidden="true"></div>

      <!-- the lamp: a dot of the state's colour at rest; opened, a ring of
           that colour round Clawd -->
      <div id="lamp" role="img" aria-label="No Claude sessions">
        <div class="bezel"></div>
        <div class="glow"></div>
        <svg class="orbit" aria-hidden="true" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><path d="M18 3.5 A14.5 14.5 0 0 1 32.5 18" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>

        <!-- Clawd (pixel style). Every scene draws the same body in the same
             place, so swapping scenes reads as one character changing pose
             rather than two characters swapping. -->
        <div class="clawd">

        <!-- clawd-scenes:start -->
        <!-- idle: plain Clawd, bobbing (frozen when no sessions).
             Starts `on` so he is visible from the first paint, before app.js runs. -->
        <svg id="scene-idle" class="scene on" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g></g>
        </svg>

        <!-- thinking: working, but no tool running yet. A bulb lights up just
             out of reach above his head; he hops for it and it bobs away. -->
        <svg id="scene-think" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <g class="jump"><rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g></g>
          <g class="bulb"><rect x="46" y="-4" width="12" height="3" fill="#F2C14E"/><rect x="43" y="-1" width="18" height="3" fill="#F2C14E"/><rect x="40" y="2" width="24" height="12" fill="#F2C14E"/><rect x="43" y="14" width="18" height="3" fill="#F2C14E"/><rect x="46" y="17" width="12" height="3" fill="#F2C14E"/><rect class="glint" x="44" y="3" width="4" height="7" fill="#FFE28F"/><rect x="47" y="20" width="10" height="3" fill="#9AA0A6"/><rect x="48" y="23" width="8" height="3" fill="#6F767D"/></g>
        </svg>

        <!-- working: hard hat with a lamp, hammering (commands and everything else) -->
        <svg id="scene-work" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob-work"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g><g class="hardhat"><rect x="34" y="16" width="36" height="7" fill="#FFC53D"/><rect x="34" y="16" width="6" height="7" fill="#E8A912"/><rect x="26" y="23" width="52" height="7" fill="#FFC53D"/><rect x="26" y="23" width="6" height="7" fill="#E8A912"/><rect x="18" y="30" width="68" height="7" fill="#E8A912"/><rect x="48" y="17" width="8" height="3" fill="#C98F12"/><rect x="45" y="20" width="14" height="9" fill="#C98F12"/><rect x="48" y="29" width="8" height="2" fill="#C98F12"/><rect x="48" y="21" width="8" height="7" fill="#FFF1B8"/></g><g class="ham-up"><rect x="84" y="36" width="16" height="16" fill="#D97757"/><rect x="90" y="18" width="4" height="18" fill="#6B4A2E"/><rect x="80" y="9" width="24" height="9" fill="#9CA3AD"/><rect x="80" y="14" width="24" height="4" fill="#6F7680"/><rect x="82" y="10" width="4" height="3" fill="#C9CFD6"/></g><g class="ham-down"><rect x="90" y="68" width="4" height="10" fill="#6B4A2E"/><rect x="82" y="78" width="24" height="9" fill="#9CA3AD"/><rect x="82" y="78" width="24" height="4" fill="#6F7680"/><rect x="84" y="83" width="4" height="3" fill="#C9CFD6"/><rect x="84" y="52" width="16" height="16" fill="#D97757"/></g></g>
        </svg>

        <!-- typing: Edit / Write -->
        <svg id="scene-type" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g><g class="laptop"><rect x="20" y="58" width="64" height="22" fill="#3a3e46"/><rect x="23" y="61" width="58" height="16" fill="#1e63b8"/><rect x="27" y="64" width="16" height="2" fill="#d6ecff"/><rect x="27" y="68" width="26" height="2" fill="#9fd3ff"/><rect x="33" y="72" width="12" height="2" fill="#d6ecff"/><rect class="caret" x="47" y="72" width="2" height="2" fill="#ffffff"/><rect x="16" y="80" width="72" height="4" fill="#4a4f59"/><rect x="20" y="81" width="64" height="2" fill="#6b727e"/></g><g class="tap tap-l"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/></g><g class="tap tap-r"><rect x="84" y="52" width="16" height="16" fill="#D97757"/></g></g>
        </svg>

        <!-- reading / searching: Read, Grep, Glob, web -->
        <svg id="scene-read" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g><g class="glass"><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="90" y="44" width="4" height="8" fill="#98A0AA"/><rect x="88" y="23" width="8" height="2" fill="#d3d8de"/><rect x="85" y="25" width="14" height="2" fill="#d3d8de"/><rect x="82" y="27" width="20" height="12" fill="#d3d8de"/><rect x="85" y="39" width="14" height="2" fill="#d3d8de"/><rect x="88" y="41" width="8" height="2" fill="#d3d8de"/><g opacity="0.55"><rect x="89" y="25" width="6" height="2" fill="#bfe0ff"/><rect x="87" y="27" width="10" height="2" fill="#bfe0ff"/><rect x="84" y="29" width="16" height="8" fill="#bfe0ff"/><rect x="87" y="37" width="10" height="2" fill="#bfe0ff"/><rect x="89" y="39" width="6" height="2" fill="#bfe0ff"/></g><rect class="glint" x="86" y="29" width="3" height="3" fill="#ffffff"/></g></g>
        </svg>

        <!-- permission: waiting on you, checking his watch (id kept from the stop-sign days) -->
        <svg id="scene-stop" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/>
          <g class="foot"><rect x="36" y="84" width="8" height="16" fill="#D97757"/></g>
          <rect x="60" y="84" width="8" height="16" fill="#D97757"/>
          <rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g><g class="watch-down"><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="84" y="58" width="16" height="4" fill="#2F3A48"/><rect x="88" y="56" width="8" height="8" fill="#3F7ACB"/><rect x="89" y="57" width="3" height="3" fill="#9CCBF7"/></g><g class="watch-up"><rect x="84" y="36" width="16" height="16" fill="#D97757"/><rect x="84" y="42" width="16" height="4" fill="#2F3A48"/><rect x="88" y="40" width="8" height="8" fill="#3F7ACB"/><rect x="89" y="41" width="3" height="3" fill="#9CCBF7"/></g></g>
        </svg>

        <!-- question: Claude is asking you something -->
        <svg id="scene-question" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="84" y="52" width="16" height="16" fill="#D97757"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g></g>
          <g class="bubble"><rect x="62" y="4" width="24" height="3" fill="#5B8FD0"/><rect x="59" y="7" width="30" height="3" fill="#5B8FD0"/><rect x="57" y="10" width="34" height="9" fill="#5B8FD0"/><rect x="59" y="19" width="30" height="3" fill="#5B8FD0"/><rect x="62" y="22" width="24" height="3" fill="#5B8FD0"/><rect x="64" y="25" width="6" height="3" fill="#5B8FD0"/><rect x="62" y="28" width="4" height="3" fill="#5B8FD0"/><rect x="60" y="10" width="3" height="5" fill="#8DBBEB"/><g class="qmark"><rect x="70" y="8" width="7" height="2" fill="#1F2933"/><rect x="75" y="10" width="2" height="3" fill="#1F2933"/><rect x="73" y="13" width="3" height="2" fill="#1F2933"/><rect x="73" y="17" width="2" height="2" fill="#1F2933"/></g></g>
        </svg>

        <!-- background work: Claude is ready, but tasks it started are still running -->
        <svg id="scene-stopwatch" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="bob"><rect x="4" y="52" width="16" height="16" fill="#BF5F42"/><rect x="20" y="36" width="64" height="48" fill="#D97757"/><rect x="20" y="36" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="44" width="8" height="8" fill="#141414"/><rect x="68" y="44" width="8" height="8" fill="#141414"/></g><g class="stopwatch"><rect x="72" y="52" width="8" height="3" fill="#9CA3AD"/><rect x="74" y="55" width="4" height="3" fill="#6F7680"/><rect x="70" y="58" width="12" height="2" fill="#9CA3AD"/><rect x="67" y="60" width="18" height="2" fill="#9CA3AD"/><rect x="65" y="62" width="22" height="2" fill="#9CA3AD"/><rect x="64" y="64" width="24" height="12" fill="#9CA3AD"/><rect x="65" y="76" width="22" height="2" fill="#9CA3AD"/><rect x="67" y="78" width="18" height="2" fill="#9CA3AD"/><rect x="70" y="80" width="12" height="2" fill="#9CA3AD"/><rect x="70" y="60" width="12" height="2" fill="#F4F1EA"/><rect x="67" y="62" width="18" height="2" fill="#F4F1EA"/><rect x="66" y="64" width="20" height="12" fill="#F4F1EA"/><rect x="67" y="76" width="18" height="2" fill="#F4F1EA"/><rect x="70" y="78" width="12" height="2" fill="#F4F1EA"/><rect x="75" y="62" width="2" height="2" fill="#1F2933"/><rect x="83" y="69" width="2" height="2" fill="#1F2933"/><rect x="75" y="76" width="2" height="2" fill="#1F2933"/><rect x="67" y="69" width="2" height="2" fill="#1F2933"/><rect class="sw-hand" x="75" y="63" width="2" height="8" fill="#C9445B"/><rect x="75" y="69" width="2" height="2" fill="#1F2933"/></g><rect x="84" y="52" width="16" height="16" fill="#D97757"/></g>
        </svg>

        <!-- bedtime: asleep, sat down on his folded legs under the blanket -->
        <svg id="scene-sleep" class="scene" viewBox="0 0 100 100" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="84" width="8" height="16" fill="#BF5F42"/><rect x="36" y="84" width="8" height="16" fill="#D97757"/><rect x="60" y="84" width="8" height="16" fill="#D97757"/><rect x="76" y="84" width="8" height="16" fill="#D97757"/>
          <g class="settle"><rect x="20" y="52" width="64" height="48" fill="#D97757"/><rect x="20" y="52" width="8" height="48" fill="#BF5F42"/><g class="eyes"><rect x="28" y="65" width="8" height="3" fill="#141414"/><rect x="68" y="65" width="8" height="3" fill="#141414"/></g><g class="prop cap"><rect x="24" y="48" width="56" height="5" fill="#F4F1EA"/><rect x="28" y="39" width="46" height="9" fill="#C9445B"/><rect x="16" y="33" width="40" height="8" fill="#C9445B"/><rect x="8" y="35" width="10" height="10" fill="#C9445B"/><rect x="4" y="43" width="10" height="8" fill="#F4F1EA"/></g></g>
          <g class="prop teddy"><rect x="45" y="54" width="4" height="4" fill="#A0714F"/><rect x="55" y="54" width="4" height="4" fill="#A0714F"/><rect x="46" y="57" width="12" height="9" fill="#A0714F"/><rect x="48" y="60" width="2" height="2" fill="#141414"/><rect x="54" y="60" width="2" height="2" fill="#141414"/><rect x="50" y="63" width="4" height="3" fill="#D9B38C"/><rect x="47" y="66" width="10" height="10" fill="#A0714F"/><rect x="44" y="68" width="3" height="6" fill="#A0714F"/><rect x="57" y="68" width="3" height="6" fill="#A0714F"/><rect x="47" y="76" width="4" height="4" fill="#A0714F"/><rect x="53" y="76" width="4" height="4" fill="#A0714F"/></g>
          <g class="prop blanket"><rect x="10" y="76" width="84" height="24" fill="#6B8FD1"/><rect x="10" y="76" width="84" height="3" fill="#93B3EA"/><rect x="10" y="86" width="84" height="2" fill="#93B3EA"/></g>
          <g class="settle"><rect x="4" y="68" width="16" height="16" fill="#BF5F42"/><rect x="84" y="68" width="16" height="16" fill="#D97757"/></g>
        </svg>
        <!-- clawd-scenes:end -->

        </div>
      </div>

      <!-- dozing: rises off the lamp while he sleeps -->
      <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>

      <!-- turns that finished since you last looked -->
      <div id="badge" hidden></div>

    </div>
  </div>
  <script src="geometry.js"></script>
  <script src="app.js"></script>
</body>
</html>
